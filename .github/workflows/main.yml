name: Bollinger Rebound Scanner

on:
  schedule:
    # 하루 1회, 미국 장 마감 후 (UTC 21:40 = 한국 06:40)
    # 서머타임(3~11월): 뉴욕 17:40 / 서머타임 해제(11~3월): 뉴욕 16:40 — 둘 다 마감 후 확정 일봉 기준
    - cron: "40 21 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "테스트 실행 (최근 거래일 기준, 중복 방지 없음)"
        type: boolean
        default: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 최근 알림 기록과 종목 목록을 다음 실행으로 넘김
      - uses: actions/cache@v4
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - run: python bb.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FORCE: ${{ inputs.force && '1' || '0' }}
